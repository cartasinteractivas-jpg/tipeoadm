<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Administrador - Mapeador de Coordenadas PDF</title>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8"></script>
    <!-- PDF-lib para generación/conversión de PDF -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <!-- PDF.js para renderizar páginas del PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- Mammoth.js para docx -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <!-- SheetJS para xlsx -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* HEADER DE ADMINISTRADOR */
        .admin-header { background: #1a252f; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #34495e; z-index: 100; }
        .admin-header h1 { font-size: 18px; color: #f1c40f; display: flex; align-items: center; gap: 10px; }

        /* CONTENEDOR PRINCIPAL */
        .main-wrapper { display: flex; flex: 1; height: calc(100vh - 55px); overflow: hidden; }

        /* PANEL LATERAL DE CONTROL */
        .sidebar { width: 320px; background: #1e1e1e; border-right: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .sidebar h2 { font-size: 15px; color: #3498db; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; color: #aaa; }
        .form-control { background: #000; color: #fff; border: 1px solid #444; padding: 8px 10px; border-radius: 6px; outline: none; font-size: 13px; }
        
        .btn { background: #3498db; color: white; border: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn:hover { background: #2980b9; }
        .btn-success { background: #2ecc71; color: #000; }
        .btn-success:hover { background: #27ae60; color: #fff; }

        /* VISTA PREVIA Y CANVAS */
        .viewport { flex: 1; background: #000; overflow: auto; position: relative; padding: 20px; display: flex; flex-direction: column; align-items: center; }

        .pdf-page-wrapper { position: relative; background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.8); margin-bottom: 25px; transform-origin: top center; }
        .pdf-canvas { display: block; width: 100%; height: auto; }
        
        .overlay-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

        /* ELEMENTOS CON COORDENADAS */
        .mapped-field {
            position: absolute;
            z-index: 20;
            border: 2px dashed #e74c3c;
            background: rgba(231, 76, 60, 0.2);
            color: #fff;
            font-weight: bold;
            font-size: 11px;
            padding: 2px 4px;
            cursor: move;
            pointer-events: auto !important;
            user-select: none;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .mapped-field.selected { border-color: #f1c40f; background: rgba(241, 196, 15, 0.3); }

        .btn-del-field { background: #e74c3c; color: white; border: none; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-left: 4px; }
        
        /* TABLA PREVIA DE CAMPOS */
        .fields-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
        .field-item { background: #2a2a2a; border: 1px solid #444; border-radius: 6px; padding: 8px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
        .field-info { display: flex; flex-direction: column; gap: 2px; }
        .field-coords { font-family: monospace; color: #f1c40f; font-size: 10px; }
    </style>
</head>
<body>

    <div class="admin-header">
        <h1>🛠️ Administrador: Mapeador de Coordenadas de Plantillas</h1>
        <button class="btn btn-success" onclick="guardarEnSupabase()">📤 Guardar Plantilla en Supabase</button>
    </div>

    <div class="main-wrapper">
        <!-- BARRA LATERAL -->
        <div class="sidebar">
            <h2>1. Datos de la Plantilla</h2>
            <div class="form-group">
                <label>Nombre de la Plantilla</label>
                <input type="text" id="nombre-plantilla" class="form-control" placeholder="Ej: Formulario FUA 062">
            </div>

            <h2>2. Archivo Base</h2>
            <div class="form-group">
                <label>Subir (PDF, Word, Excel, Imagen)</label>
                <input type="file" id="file-input" class="form-control" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png">
            </div>

            <h2>3. Agregar Campo</h2>
            <div class="form-group">
                <label>Identificador del Campo (Key)</label>
                <input type="text" id="field-key" class="form-control" placeholder="Ej: nombre_paciente">
            </div>
            <div class="form-group">
                <label>Tipo de Campo</label>
                <select id="field-type" class="form-control">
                    <option value="texto">Texto</option>
                    <option value="firma">Firma / Marca</option>
                    <option value="fecha">Fecha</option>
                </select>
            </div>
            <button class="btn" onclick="agregarCampoMarcador()">➕ Agregar Campo a la Hoja</button>

            <h2>4. Campos Mapeados</h2>
            <div id="fields-list" class="fields-list">
                <span style="color: #777; font-size: 12px;">No hay campos mapeados.</span>
            </div>
        </div>

        <!-- ÁREA DE EDICIÓN / CANVAS -->
        <div class="viewport" id="viewport">
            <div id="placeholder" style="color: #666; margin-top: 100px; text-align: center;">
                <div style="font-size: 50px;">📄</div>
                <p>Suba un archivo para comenzar a configurar la plantilla.</p>
            </div>
            <div id="canvas-container"></div>
        </div>
    </div>

<script>
    // CONFIGURACIÓN DE SUPABASE
    const supabaseUrl = 'https://wpzddhmllctdsiuxenss.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndwemRkaG1sbGN0ZHNpdXhlbnNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NjUyNzQsImV4cCI6MjA5OTU0MTI3NH0.hwSxJ3Sk_RlgbvFyr8S64XRuxW7j55BU4gaIneFTuhY';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pdfDocumentoBytes = null;
    let totalPaginas = 0;
    let camposMapeados = []; // Guarda las coordenadas relativas (0 a 1)

    // 1. GESTIÓN DE SUBIDA Y CONVERSIÓN A PDF
    document.getElementById('file-input').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('placeholder').innerText = "⏳ Procesando y convirtiendo archivo a PDF...";

        try {
            if (file.type === 'application/pdf') {
                pdfDocumentoBytes = await file.arrayBuffer();
            } else if (file.type.startsWith('image/')) {
                const pdfDoc = await PDFLib.PDFDocument.create();
                const imageBytes = await file.arrayBuffer();
                const img = file.type.includes('png') ? await pdfDoc.embedPng(imageBytes) : await pdfDoc.embedJpg(imageBytes);
                const page = pdfDoc.addPage([img.width, img.height]);
                page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
                pdfDocumentoBytes = await pdfDoc.save();
            } else {
                // Si es Word o Excel, extraer texto y armar un PDF estándar A4
                let textoExtraido = "";
                if (file.name.endsWith('.docx')) {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer });
                    textoExtraido = result.value;
                } else if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                    const arrayBuffer = await file.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                    workbook.SheetNames.forEach(sheet => {
                        textoExtraido += XLSX.utils.sheet_to_txt(workbook.Sheets[sheet]) + "\n";
                    });
                }
                
                const pdfDoc = await PDFLib.PDFDocument.create();
                const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
                let page = pdfDoc.addPage(PDFLib.PageSizes.A4);
                let y = page.getHeight() - 40;

                const lines = textoExtraido.split('\n');
                for (let line of lines) {
                    if (y < 40) {
                        page = pdfDoc.addPage(PDFLib.PageSizes.A4);
                        y = page.getHeight() - 40;
                    }
                    if (line.trim()) {
                        page.drawText(line.substring(0, 80), { x: 40, y, size: 10, font });
                    }
                    y -= 14;
                }
                pdfDocumentoBytes = await pdfDoc.save();
            }

            renderizarPDFEnPantalla(pdfDocumentoBytes);
        } catch (err) {
            alert("Error procesando el archivo: " + err.message);
        }
    });

    // 2. RENDERIZAR PAGINAS PDF EN PANTALLA
    async function renderizarPDFEnPantalla(arrayBuffer) {
        const container = document.getElementById('canvas-container');
        container.innerHTML = '';
        document.getElementById('placeholder').style.display = 'none';

        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        totalPaginas = pdf.numPages;

        for (let num = 1; num <= totalPaginas; num++) {
            const page = await pdf.getPage(num);
            const viewport = page.getViewport({ scale: 1.2 });

            const wrapper = document.createElement('div');
            wrapper.className = 'pdf-page-wrapper';
            wrapper.dataset.pageNum = num;
            wrapper.style.width = `${viewport.width}px`;
            wrapper.style.height = `${viewport.height}px`;

            const canvas = document.createElement('canvas');
            canvas.className = 'pdf-canvas';
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            const overlay = document.createElement('div');
            overlay.className = 'overlay-layer';

            wrapper.appendChild(canvas);
            wrapper.appendChild(overlay);
            container.appendChild(wrapper);

            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        }
    }

    // 3. AGREGAR CAMPO Y REGISTRAR COORDENADAS
    function agregarCampoMarcador() {
        const key = document.getElementById('field-key').value.trim();
        const tipo = document.getElementById('field-type').value;

        if (!key) { alert("Ingresa un identificador para el campo."); return; }
        if (!totalPaginas) { alert("Primero sube un documento."); return; }

        const primeraHojaOverlay = document.querySelector('.overlay-layer');
        const pageNum = 1;

        // Coordenadas relativas iniciales (Centrado por defecto)
        const nuevoCampo = {
            id: 'f_' + Date.now(),
            key: key,
            tipo: tipo,
            page_num: pageNum,
            rel_x: 0.1,  // 10% del ancho de la hoja
            rel_y: 0.1,  // 10% de la altura de la hoja
            rel_w: 0.25, // 25% de ancho
            rel_h: 0.04  // 4% de alto
        };

        camposMapeados.push(nuevoCampo);
        crearElementoGraficoField(primeraHojaOverlay, nuevoCampo);
        actualizarListaCamposSidebar();
        document.getElementById('field-key').value = '';
    }

    // 4. CREAR ELEMENTO DRAGGABLE EN VISTA
    function crearElementoGraficoField(parentOverlay, fieldData) {
        const el = document.createElement('div');
        el.className = 'mapped-field';
        el.id = fieldData.id;
        
        // Convertir proporciones a pixeles del contenedor actual
        const parentW = parentOverlay.offsetWidth;
        const parentH = parentOverlay.offsetHeight;

        el.style.left = `${fieldData.rel_x * 100}%`;
        el.style.top = `${fieldData.rel_y * 100}%`;
        el.style.width = `${fieldData.rel_w * 100}%`;
        el.style.height = `${fieldData.rel_h * 100}%`;

        el.innerHTML = `<span>${fieldData.key}</span><button class="btn-del-field" onclick="eliminarCampo('${fieldData.id}')">×</button>`;

        parentOverlay.appendChild(el);
        hacerArrastrable(el, fieldData);
    }

    // 5. CÁLCULO DE COORDENADAS AL ARRASTRAR
    function hacerArrastrable(el, fieldData) {
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        el.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('btn-del-field')) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            initialLeft = el.offsetLeft;
            initialTop = el.offsetTop;
            
            document.querySelectorAll('.mapped-field').forEach(m => m.classList.remove('selected'));
            el.classList.add('selected');
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const parent = el.parentElement;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            let newLeft = initialLeft + dx;
            let newTop = initialTop + dy;

            // Calcular % relativo respecto al contenedor
            fieldData.rel_x = newLeft / parent.offsetWidth;
            fieldData.rel_y = newTop / parent.offsetHeight;

            el.style.left = `${fieldData.rel_x * 100}%`;
            el.style.top = `${fieldData.rel_y * 100}%`;

            actualizarListaCamposSidebar();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });
    }

    function eliminarCampo(id) {
        camposMapeados = camposMapeados.filter(c => c.id !== id);
        const domEl = document.getElementById(id);
        if (domEl) domEl.remove();
        actualizarListaCamposSidebar();
    }

    function actualizarListaCamposSidebar() {
        const list = document.getElementById('fields-list');
        if (camposMapeados.length === 0) {
            list.innerHTML = '<span style="color: #777; font-size: 12px;">No hay campos mapeados.</span>';
            return;
        }

        list.innerHTML = '';
        camposMapeados.forEach(c => {
            const item = document.createElement('div');
            item.className = 'field-item';
            item.innerHTML = `
                <div class="field-info">
                    <strong>${c.key} (${c.tipo})</strong>
                    <span class="field-coords">Pág ${c.page_num} | X: ${(c.rel_x*100).toFixed(1)}% Y: ${(c.rel_y*100).toFixed(1)}%</span>
                </div>
            `;
            list.appendChild(item);
        });
    }

    // 6. GUARDAR EN LA BASE DE DATOS SUPABASE
    async function guardarEnSupabase() {
        const nombrePlantilla = document.getElementById('nombre-plantilla').value.trim();
        if (!nombrePlantilla) { alert("⚠️ Asigna un nombre a la plantilla."); return; }
        if (camposMapeados.length === 0) { alert("⚠️ Agrega al menos un campo mapeado."); return; }
        if (!pdfDocumentoBytes) { alert("⚠️ Sube un archivo base."); return; }

        try {
            // A) Subir el archivo PDF base a Supabase Storage
            const nombreArchivoStorage = `plantillas/template_${Date.now()}.pdf`;
            const { data: storageData, error: storageError } = await supabase
                .storage
                .from('documentos')
                .upload(nombreArchivoStorage, pdfDocumentoBytes, { contentType: 'application/pdf' });

            if (storageError) throw storageError;

            // B) Insertar la cabecera de la plantilla
            const { data: plantillaData, error: plantillaError } = await supabase
                .from('plantillas')
                .insert([{
                    nombre: nombrePlantilla,
                    archivo_url: storageData.path,
                    total_paginas: totalPaginas
                }])
                .select()
                .single();

            if (plantillaError) throw plantillaError;

            // C) Insertar la lista de coordenadas asociadas
            const camposAInsertar = camposMapeados.map(c => ({
                plantilla_id: plantillaData.id,
                campo_key: c.key,
                tipo_campo: c.tipo,
                numero_pagina: c.page_num,
                pos_x_porcentaje: c.rel_x,
                pos_y_porcentaje: c.rel_y,
                ancho_porcentaje: c.rel_w,
                alto_porcentaje: c.rel_h
            }));

            const { error: camposError } = await supabase
                .from('plantillas_campos')
                .insert(camposAInsertar);

            if (camposError) throw camposError;

            alert("✅ ¡Plantilla y coordenadas guardadas con éxito en Supabase!");
            location.reload();

        } catch (err) {
            alert("❌ Error guardando plantilla: " + err.message);
        }
    }
</script>
</body>
</html>
