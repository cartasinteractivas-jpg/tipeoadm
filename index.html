<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador - Mapeador de Puntos y Coordenadas PDF</title>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8"></script>
    <!-- PDF-lib -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- Mammoth.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* HEADER */
        .admin-header { background: #1a252f; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #34495e; z-index: 100; }
        .admin-header h1 { font-size: 18px; color: #f1c40f; display: flex; align-items: center; gap: 10px; }

        /* LAYOUT PRINCIPAL */
        .main-wrapper { display: flex; flex: 1; height: calc(100vh - 55px); overflow: hidden; }

        /* SIDEBAR DE CONTROL */
        .sidebar { width: 340px; background: #1e1e1e; border-right: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .sidebar h2 { font-size: 14px; color: #3498db; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; color: #aaa; }
        .form-control { background: #000; color: #fff; border: 1px solid #444; padding: 8px 10px; border-radius: 6px; outline: none; font-size: 13px; }
        
        .btn { background: #3498db; color: white; border: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn:hover { background: #2980b9; }
        .btn-success { background: #2ecc71; color: #000; }
        .btn-success:hover { background: #27ae60; color: #fff; }

        /* VISUALIZADOR DE DOCUMENTO */
        .viewport { flex: 1; background: #000; overflow: auto; position: relative; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .pdf-page-wrapper { position: relative; background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.8); margin-bottom: 25px; }
        .pdf-canvas { display: block; width: 100%; height: auto; }
        .overlay-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; }

        /* PUNTOS DE CONTROL EN EL CANVAS */
        .point-marker {
            position: absolute;
            width: 24px;
            height: 24px;
            background: #e74c3c;
            border: 2px solid #ffffff;
            border-radius: 50%;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            cursor: move;
            z-index: 30;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            user-select: none;
        }
        .point-marker.selected { background: #f1c40f; color: #000; border-color: #000; scale: 1.2; }

        /* LISTA DE PUNTOS EN SIDEBAR */
        .points-list { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; }
        .point-item { background: #2a2a2a; border: 1px solid #444; border-radius: 6px; padding: 8px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
        .point-info { display: flex; flex-direction: column; gap: 2px; }
        .point-coords { font-family: monospace; color: #f1c40f; font-size: 10px; }
        .btn-del { background: #e74c3c; color: white; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 10px; }
    </style>
</head>
<body>

    <div class="admin-header">
        <h1>📍 Administrador: Mapeador de Puntos y Coordenadas</h1>
        <button class="btn btn-success" onclick="guardarEnSupabase()">📤 Guardar en Base de Datos</button>
    </div>

    <div class="main-wrapper">
        <!-- BARRA LATERAL -->
        <div class="sidebar">
            <h2>1. Plantilla</h2>
            <div class="form-group">
                <label>Nombre de Configuración</label>
                <input type="text" id="nombre-plantilla" class="form-control" placeholder="Ej: Formato FUA Puntos">
            </div>

            <h2>2. Archivo Base</h2>
            <div class="form-group">
                <label>Subir (PDF, Word, Excel, Imagen)</label>
                <input type="file" id="file-input" class="form-control" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png">
            </div>

            <h2>3. Nuevo Punto</h2>
            <div class="form-group">
                <label>Nombre / Etiqueta del Punto</label>
                <input type="text" id="point-label" class="form-control" placeholder="Ej: Punto_Firma_1">
            </div>
            <button class="btn" onclick="agregarPuntoManual()">📍 Agregar Punto al Documento</button>

            <h2>4. Registro de Puntos Mapeados</h2>
            <div id="points-list" class="points-list">
                <span style="color: #777; font-size: 12px;">No hay puntos marcados. Haz clic en el documento o agrega uno arriba.</span>
            </div>
        </div>

        <!-- ÁREA DEL DOCUMENTO -->
        <div class="viewport" id="viewport">
            <div id="placeholder" style="color: #666; margin-top: 100px; text-align: center;">
                <div style="font-size: 50px;">📄</div>
                <p>Cargue un archivo para renderizar las páginas y ubicar los puntos.</p>
            </div>
            <div id="canvas-container"></div>
        </div>
    </div>

<script>
    // CONFIGURACIÓN DE SUPABASE
    const supabaseUrl = 'https://wpzddhmllctdsiuxenss.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndwemRkaG1sbGN0ZHNpdXhlbnNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NjUyNzQsImV4cCI6MjA5OTU0MTI3NH0.hwSxJ3Sk_RlgbvFyr8S64XRuxW7j55BU4gaIneFTuhY';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pdfDocumentoBytes = null;
    let totalPaginas = 0;
    let puntosMapeados = []; // Almacena el listado de puntos en coordenadas relativas (0 a 1)

    // 1. LECTURA Y CONVERSIÓN DEL ARCHIVO A PDF
    document.getElementById('file-input').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('placeholder').innerText = "⏳ Convirtiendo y renderizando archivo...";

        try {
            if (file.type === 'application/pdf') {
                pdfDocumentoBytes = await file.arrayBuffer();
            } else if (file.type.startsWith('image/')) {
                const pdfDoc = await PDFLib.PDFDocument.create();
                const imageBytes = await file.arrayBuffer();
                const img = file.type.includes('png') ? await pdfDoc.embedPng(imageBytes) : await pdfDoc.embedJpg(imageBytes);
                const page = pdfDoc.addPage([img.width, img.height]);
                page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
                pdfDocumentoBytes = await pdfDoc.save();
            } else {
                let texto = "";
                if (file.name.endsWith('.docx')) {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer });
                    texto = result.value;
                } else if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                    const arrayBuffer = await file.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                    workbook.SheetNames.forEach(sheet => {
                        texto += XLSX.utils.sheet_to_txt(workbook.Sheets[sheet]) + "\n";
                    });
                }
                
                const pdfDoc = await PDFLib.PDFDocument.create();
                const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
                let page = pdfDoc.addPage(PDFLib.PageSizes.A4);
                let y = page.getHeight() - 40;

                const lines = texto.split('\n');
                for (let line of lines) {
                    if (y < 40) {
                        page = pdfDoc.addPage(PDFLib.PageSizes.A4);
                        y = page.getHeight() - 40;
                    }
                    if (line.trim()) {
                        page.drawText(line.substring(0, 80), { x: 40, y, size: 10, font });
                    }
                    y -= 14;
                }
                pdfDocumentoBytes = await pdfDoc.save();
            }

            renderizarDocumento(pdfDocumentoBytes);
        } catch (err) {
            alert("Error al procesar el archivo: " + err.message);
        }
    });

    // 2. RENDERIZAR PÁGINAS PDF Y CAPTURAR CLICS
    async function renderizarDocumento(arrayBuffer) {
        const container = document.getElementById('canvas-container');
        container.innerHTML = '';
        document.getElementById('placeholder').style.display = 'none';

        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        totalPaginas = pdf.numPages;

        for (let num = 1; num <= totalPaginas; num++) {
            const page = await pdf.getPage(num);
            const viewport = page.getViewport({ scale: 1.2 });

            const wrapper = document.createElement('div');
            wrapper.className = 'pdf-page-wrapper';
            wrapper.dataset.pageNum = num;
            wrapper.style.width = `${viewport.width}px`;
            wrapper.style.height = `${viewport.height}px`;

            const canvas = document.createElement('canvas');
            canvas.className = 'pdf-canvas';
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            const overlay = document.createElement('div');
            overlay.className = 'overlay-layer';
            overlay.dataset.pageNum = num;

            // Permite crear un punto haciendo clic directamente sobre la hoja
            overlay.addEventListener('click', (e) => {
                if (e.target !== overlay) return;
                const rect = overlay.getBoundingClientRect();
                const relX = (e.clientX - rect.left) / rect.width;
                const relY = (e.clientY - rect.top) / rect.height;
                const tag = prompt("Nombre o código para este punto:", `Punto_${puntosMapeados.length + 1}`);
                if (tag) {
                    crearPuntoObj(tag, num, relX, relY, overlay);
                }
            });

            wrapper.appendChild(canvas);
            wrapper.appendChild(overlay);
            container.appendChild(wrapper);

            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        }
    }

    // 3. REGISTRAR OBJETO DE PUNTO
    function agregarPuntoManual() {
        const tag = document.getElementById('point-label').value.trim();
        if (!tag) { alert("Ingresa un nombre para el punto."); return; }
        if (!totalPaginas) { alert("Carga un archivo primero."); return; }

        const overlay = document.querySelector('.overlay-layer[data-page-num="1"]');
        crearPuntoObj(tag, 1, 0.5, 0.5, overlay);
        document.getElementById('point-label').value = '';
    }

    function crearPuntoObj(etiqueta, numPagina, relX, relY, overlayEl) {
        const nuevoPunto = {
            id: 'p_' + Date.now(),
            label: etiqueta,
            page_num: numPagina,
            rel_x: relX,
            rel_y: relY
        };

        puntosMapeados.push(nuevoPunto);
        dibujarMarcadorDOM(overlayEl, nuevoPunto);
        actualizarListaPuntosSidebar();
    }

    // 4. CREAR MARCADOR INTERACTIVO (ARRASTRE DE PUNTOS)
    function dibujarMarcadorDOM(overlayEl, puntoObj) {
        const marker = document.createElement('div');
        marker.className = 'point-marker';
        marker.id = puntoObj.id;
        marker.innerText = puntoObj.label.substring(0, 3).toUpperCase();
        marker.title = puntoObj.label;

        marker.style.left = `${puntoObj.rel_x * 100}%`;
        marker.style.top = `${puntoObj.rel_y * 100}%`;

        overlayEl.appendChild(marker);
        hacerPuntoArrastrable(marker, puntoObj);
    }

    function hacerPuntoArrastrable(marker, puntoObj) {
        let isDragging = false;

        marker.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            isDragging = true;
            document.querySelectorAll('.point-marker').forEach(m => m.classList.remove('selected'));
            marker.classList.add('selected');
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const parent = marker.parentElement;
            const rect = parent.getBoundingClientRect();

            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;

            // Restringir a los límites de la página
            x = Math.max(0, Math.min(x, rect.width));
            y = Math.max(0, Math.min(y, rect.height));

            puntoObj.rel_x = x / rect.width;
            puntoObj.rel_y = y / rect.height;

            marker.style.left = `${puntoObj.rel_x * 100}%`;
            marker.style.top = `${puntoObj.rel_y * 100}%`;

            actualizarListaPuntosSidebar();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });
    }

    function eliminarPunto(id) {
        puntosMapeados = puntosMapeados.filter(p => p.id !== id);
        const domEl = document.getElementById(id);
        if (domEl) domEl.remove();
        actualizarListaPuntosSidebar();
    }

    function actualizarListaPuntosSidebar() {
        const list = document.getElementById('points-list');
        if (puntosMapeados.length === 0) {
            list.innerHTML = '<span style="color: #777; font-size: 12px;">No hay puntos marcados. Haz clic en el documento o agrega uno arriba.</span>';
            return;
        }

        list.innerHTML = '';
        puntosMapeados.forEach(p => {
            const item = document.createElement('div');
            item.className = 'field-item point-item';
            item.innerHTML = `
                <div class="point-info">
                    <strong>📍 ${p.label}</strong>
                    <span class="point-coords">Pág ${p.page_num} | X: ${(p.rel_x*100).toFixed(1)}% | Y: ${(p.rel_y*100).toFixed(1)}%</span>
                </div>
                <button class="btn-del" onclick="eliminarPunto('${p.id}')">Borrar</button>
            `;
            list.appendChild(item);
        });
    }

    // 5. GUARDAR EN SUPABASE (SOLO TOMA COORDENADAS)
    async function guardarEnSupabase() {
        const nombrePlantilla = document.getElementById('nombre-plantilla').value.trim();
        if (!nombrePlantilla) { alert("⚠️ Asigna un nombre a la plantilla."); return; }
        if (puntosMapeados.length === 0) { alert("⚠️ Debes ubicar al menos un punto en el documento."); return; }
        if (!pdfDocumentoBytes) { alert("⚠️ Sube un archivo base."); return; }

        try {
            // A) Subir PDF a Supabase Storage
            const pathStorage = `plantillas/puntos_${Date.now()}.pdf`;
            const { data: storageData, error: storageError } = await supabase
                .storage
                .from('documentos')
                .upload(pathStorage, pdfDocumentoBytes, { contentType: 'application/pdf' });

            if (storageError) throw storageError;

            // B) Crear registro en la tabla cabecera
            const { data: plantillaData, error: plantillaError } = await supabase
                .from('plantillas')
                .insert([{
                    nombre: nombrePlantilla,
                    archivo_url: storageData.path,
                    total_paginas: totalPaginas
                }])
                .select()
                .single();

            if (plantillaError) throw plantillaError;

            // C) Insertar únicamente la tabla de puntos / coordenadas
            const filasPuntos = puntosMapeados.map(p => ({
                plantilla_id: plantillaData.id,
                etiqueta_punto: p.label,
                numero_pagina: p.page_num,
                pos_x_porcentaje: p.rel_x,
                pos_y_porcentaje: p.rel_y
            }));

            const { error: puntosError } = await supabase
                .from('plantillas_puntos')
                .insert(filasPuntos);

            if (puntosError) throw puntosError;

            alert("✅ ¡Documento procesado y lista de puntos guardada correctamente!");
            location.reload();

        } catch (err) {
            alert("❌ Error guardando puntos: " + err.message);
        }
    }
</script>
</body>
</html>
